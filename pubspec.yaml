name: taskly
description: "TASKLY — Don't just remind me when. Remind me what. Spoken smart reminder & productivity app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local Database & Storage
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2

  # Core Utilities & UI
  uuid: ^4.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  table_calendar: ^3.1.3

  # Audio & Notifications
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/
